  <style>
    html, body { margin: 0; padding: 0; height: auto; min-height: 0; }
    #plugin-root { height: auto; }
    body { display: block; }
    dialog.fig-fill-picker-dialog {
      width: 300px; max-width: 300px; min-width: 300px;
      max-height: none; height: max-content;
    }

    .preview-wrap {
      display: flex; flex-direction: column; align-items: center;
      padding: var(--spacer-3);
      gap: var(--spacer-2);
      background: var(--figma-color-bg-secondary);
    }
    .preview-container {
      width: 300px; height: 300px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .preview-container canvas {
      image-rendering: pixelated;
    }
    .preview-placeholder {
      color: var(--figma-color-text-secondary);
      font-family: var(--font-family);
      font-size: var(--body-medium-fontSize);
    }
    .source-buttons {
      display: flex; gap: var(--spacer-2); width: 100%;
    }
    .source-buttons fig-button { flex: 1; }

    .color-row {
      display: none;
      gap: var(--spacer-2);
    }
    .color-row.visible {
      display: flex;
    }
    .color-row fig-field { flex: 1; }

    .resize-section {
      display: none;
    }
    .resize-section.visible {
      display: block;
    }
    .resize-info {
      font-family: var(--font-family);
      font-size: var(--body-medium-fontSize);
      color: var(--figma-color-text-secondary);
      padding: 0 var(--spacer-3);
    }
    .resize-dims {
      display: flex;
      gap: var(--spacer-2);
      align-items: center;
    }
    .resize-dims fig-field { flex: 1; }
    .resize-dims .dim-separator {
      color: var(--figma-color-text-secondary);
      font-family: var(--font-family);
      font-size: var(--body-medium-fontSize);
      padding-top: 18px;
    }
    .resize-warning {
      font-family: var(--font-family);
      font-size: 11px;
      color: var(--figma-color-text-danger);
      padding: 0 var(--spacer-3);
      display: none;
    }
    .resize-warning.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="plugin-root">
    <!-- Preview -->
    <div class="preview-wrap">
      <div class="preview-container">
        <canvas id="preview-canvas" style="display:none;"></canvas>
        <span class="preview-placeholder" id="placeholder">No image loaded</span>
      </div>
      <div class="source-buttons">
        <fig-button id="btn-upload" variant="secondary" full>Upload image</fig-button>
        <fig-button id="btn-select" variant="secondary" full>Select layer</fig-button>
      </div>
    </div>

    <input type="file" id="file-input" accept="image/*" style="display:none;">

    <fig-content>
      <fig-group name="Settings">
        <fig-field>
          <label>Output width</label>
          <fig-slider id="output-width" type="range" min="16" max="500" step="1" value="110" units="px" text></fig-slider>
        </fig-field>
        <fig-field>
          <label>Output height</label>
          <span id="output-height-display" style="font-family:var(--font-family);font-size:var(--body-medium-fontSize);color:var(--figma-color-text-secondary);">—</span>
        </fig-field>
        <fig-field>
          <label>Pixel size</label>
          <fig-slider id="pixel-size" type="range" min="1" max="10" step="1" value="1" units="px" text></fig-slider>
        </fig-field>
        <fig-field>
          <label>Dither type</label>
          <fig-options id="dither-type" options="Ordered (Bayer),Random (Noise),Halftone" value="Ordered (Bayer)"></fig-options>
        </fig-field>
        <fig-field>
          <label>Palette</label>
          <fig-dropdown id="palette" value="bow">
            <option value="bow">Black on white</option>
            <option value="wob">White on black</option>
            <option value="colour">Colour</option>
          </fig-dropdown>
        </fig-field>
        <div class="color-row" id="color-row">
          <fig-field>
            <label>Light colour</label>
            <fig-input-color id="light-color" value="#FFD000" picker="figma-native" alpha="false"></fig-input-color>
          </fig-field>
          <fig-field>
            <label>Dark colour</label>
            <fig-input-color id="dark-color" value="#000B80" picker="figma-native" alpha="false"></fig-input-color>
          </fig-field>
        </div>
        <fig-field>
          <label>Threshold</label>
          <fig-slider id="threshold" type="range" min="0" max="1" step="0.01" value="0.35" text precision="2"></fig-slider>
        </fig-field>
        <fig-field>
          <label>Brightness</label>
          <fig-slider id="brightness" type="range" min="-100" max="100" step="1" value="0" text></fig-slider>
        </fig-field>
        <fig-field>
          <label>Contrast</label>
          <fig-slider id="contrast" type="range" min="-100" max="100" step="1" value="0" text></fig-slider>
        </fig-field>
      </fig-group>
      <fig-group name="Export">
        <fig-field>
          <label>Export single rectangles</label>
          <fig-switch id="single-rects"></fig-switch>
        </fig-field>
      </fig-group>

      <!-- Resize pixel art section - visible when pixel art frame is selected -->
      <div class="resize-section" id="resize-section">
        <fig-group name="Resize pixel art">
          <p class="resize-info" id="resize-source-info"></p>
          <div class="resize-dims">
            <fig-field>
              <label>Width</label>
              <fig-input-number id="resize-width" value="32" min="16" max="1000" units="px"></fig-input-number>
            </fig-field>
            <span class="dim-separator">&times;</span>
            <fig-field>
              <label>Height</label>
              <span id="resize-height-display" style="font-family:var(--font-family);font-size:var(--body-medium-fontSize);color:var(--figma-color-text-secondary);">—</span>
            </fig-field>
          </div>
          <p class="resize-warning" id="resize-warning">Both dimensions must be at least 16px</p>
          <fig-field>
            <label>Threshold</label>
            <fig-slider id="resize-threshold" type="range" min="0" max="1" step="0.01" value="0.45" text precision="2"></fig-slider>
          </fig-field>
        </fig-group>
      </div>
    </fig-content>

    <fig-footer sticky>
      <label id="status-label">Load an image to preview</label>
      <fig-button id="btn-resize" variant="secondary" style="display:none;">Resize</fig-button>
      <fig-button id="btn-apply" disabled>Apply dither</fig-button>
    </fig-footer>
  </div>

  <script>
    /* ── State ── */
    let sourceImage = null // HTMLImageElement
    let imageLoaded = false
    let sourceName = 'Dithered SVG'
    let pixelArtInfo = null // { width, height, pixelCount, name }

    /* ── DOM refs ── */
    const canvas = document.getElementById('preview-canvas')
    const ctx = canvas.getContext('2d')
    const placeholder = document.getElementById('placeholder')
    const fileInput = document.getElementById('file-input')
    const btnUpload = document.getElementById('btn-upload')
    const btnSelect = document.getElementById('btn-select')
    const btnApply = document.getElementById('btn-apply')
    const btnResize = document.getElementById('btn-resize')
    const statusLabel = document.getElementById('status-label')
    const colorRow = document.getElementById('color-row')
    const paletteEl = document.getElementById('palette')
    const resizeSection = document.getElementById('resize-section')
    const resizeSourceInfo = document.getElementById('resize-source-info')
    const resizeWidthEl = document.getElementById('resize-width')
    const resizeHeightDisplay = document.getElementById('resize-height-display')
    const resizeWarning = document.getElementById('resize-warning')
    const resizeThresholdEl = document.getElementById('resize-threshold')

    /* ── Resize observer ── */
    let lastReportedHeight = 0
    let resizeRaf = 0
    function measurePanelHeight() {
      const root = document.getElementById('plugin-root')
      if (!root) return 0
      let h = Math.ceil(root.getBoundingClientRect().height)
      const openDialog = document.querySelector('dialog.fig-fill-picker-dialog[open]')
      if (openDialog) h = Math.max(h, Math.ceil(openDialog.getBoundingClientRect().bottom))
      return h
    }
    function reportHeight() {
      const h = measurePanelHeight()
      if (h && h !== lastReportedHeight) {
        lastReportedHeight = h
        parent.postMessage({ pluginMessage: { type: 'resize', height: h } }, '*')
      }
    }
    const root = document.getElementById('plugin-root')
    if (root && typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(() => {
        if (resizeRaf) cancelAnimationFrame(resizeRaf)
        resizeRaf = requestAnimationFrame(reportHeight)
      }).observe(root)
    }
    new MutationObserver(() => {
      if (resizeRaf) cancelAnimationFrame(resizeRaf)
      resizeRaf = requestAnimationFrame(reportHeight)
    }).observe(document.body, {
      childList: true, attributes: true, attributeFilter: ['open'], subtree: true,
    })

    /* ── Palette toggle ── */
    function updateColorRowVisibility() {
      const val = paletteEl.value
      if (val === 'colour') {
        colorRow.classList.add('visible')
      } else {
        colorRow.classList.remove('visible')
      }
    }
    paletteEl.addEventListener('change', () => { updateColorRowVisibility(); renderPreview() })
    updateColorRowVisibility()

    /* ── Bayer matrix ── */
    const BAYER4 = [
      [ 0,  8,  2, 10],
      [12,  4, 14,  6],
      [ 3, 11,  1,  9],
      [15,  7, 13,  5],
    ]

    const outputWidthEl = document.getElementById('output-width')
    const outputHeightDisplay = document.getElementById('output-height-display')

    /* ── Update output height from source ratio ── */
    function updateOutputHeight() {
      if (!sourceImage) return
      const outputWidth = Number(outputWidthEl.value)
      const pixelSize = Number(document.getElementById('pixel-size').value)
      const gridW = Math.max(1, Math.floor(outputWidth / pixelSize))
      const ratio = sourceImage.naturalHeight / sourceImage.naturalWidth
      const gridH = Math.max(1, Math.round(gridW * ratio))
      const computedHeight = gridH * pixelSize
      outputHeightDisplay.textContent = computedHeight + 'px'
    }

    /* ── Read current params ── */
    function getParams() {
      const outputWidth = Number(outputWidthEl.value)
      const pixelSize = Number(document.getElementById('pixel-size').value)
      const ditherType = document.getElementById('dither-type').value
      const palette = paletteEl.value
      const threshold = Number(document.getElementById('threshold').value)
      const brightness = Number(document.getElementById('brightness').value)
      const contrast = Number(document.getElementById('contrast').value)
      const lightColor = document.getElementById('light-color').value || '#FFD000'
      const darkColor = document.getElementById('dark-color').value || '#000B80'
      return { outputWidth, pixelSize, ditherType, palette, threshold, brightness, contrast, lightColor, darkColor }
    }

    function hexToRgb(hex) {
      const h = hex.replace('#', '')
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16),
      }
    }

    /* ── Dithering logic ── */
    function computeDither(params) {
      const { outputWidth, pixelSize, ditherType, threshold, brightness, contrast } = params
      const gridW = Math.max(1, Math.floor(outputWidth / pixelSize))
      // Derive height from source image aspect ratio
      const ratio = sourceImage ? (sourceImage.naturalHeight / sourceImage.naturalWidth) : 1
      const gridH = Math.max(1, Math.round(gridW * ratio))

      const contrastFactor = (259 * (contrast + 255)) / (255 * (259 - contrast))

      const tmpCanvas = document.createElement('canvas')
      tmpCanvas.width = gridW
      tmpCanvas.height = gridH
      const tmpCtx = tmpCanvas.getContext('2d')
      tmpCtx.drawImage(sourceImage, 0, 0, gridW, gridH)
      const imgData = tmpCtx.getImageData(0, 0, gridW, gridH)
      const pixels = imgData.data

      const grid = []
      for (let y = 0; y < gridH; y++) {
        const row = []
        for (let x = 0; x < gridW; x++) {
          const idx = (y * gridW + x) * 4
          const r = pixels[idx]
          const g = pixels[idx + 1]
          const b = pixels[idx + 2]

          let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255
          lum = lum + brightness / 255
          lum = contrastFactor * (lum - 0.5) + 0.5
          lum = Math.max(0, Math.min(1, lum))

          let isForeground = false
          if (ditherType === 'Ordered (Bayer)') {
            const bx = x % 4
            const by = y % 4
            const bayerVal = BAYER4[by][bx] / 16
            isForeground = lum < threshold + (bayerVal - 0.5) * 0.5
          } else if (ditherType === 'Random (Noise)') {
            isForeground = lum < threshold + (Math.random() - 0.5) * 0.3
          } else {
            const cx = (x % 4) - 1.5
            const cy = (y % 4) - 1.5
            const dist = Math.sqrt(cx * cx + cy * cy) / 2.12
            isForeground = lum < threshold + (dist - 0.5) * 0.4
          }
          row.push(isForeground)
        }
        grid.push(row)
      }
      return { grid, gridW, gridH }
    }

    /* ── Render preview onto canvas ── */
    function renderPreview() {
      if (!imageLoaded || !sourceImage) return
      updateOutputHeight()
      const params = getParams()
      const { grid, gridW, gridH } = computeDither(params)
      const { pixelSize, palette, lightColor, darkColor } = params
      const canvasW = gridW * pixelSize
      const canvasH = gridH * pixelSize

      canvas.width = canvasW
      canvas.height = canvasH
      canvas.style.display = 'block'
      placeholder.style.display = 'none'

      // Scale preview to fit within 300px on longest side
      const maxPreview = 300
      const scale = Math.min(1, maxPreview / Math.max(canvasW, canvasH))
      canvas.style.width = Math.round(canvasW * scale) + 'px'
      canvas.style.height = Math.round(canvasH * scale) + 'px'

      let bgColor, fgColor
      if (palette === 'wob') {
        bgColor = '#000000'; fgColor = '#FFFFFF'
      } else if (palette === 'bow') {
        bgColor = '#FFFFFF'; fgColor = '#000000'
      } else {
        bgColor = darkColor; fgColor = lightColor
      }

      ctx.fillStyle = bgColor
      ctx.fillRect(0, 0, canvasW, canvasH)

      ctx.fillStyle = fgColor
      for (let y = 0; y < gridH; y++) {
        for (let x = 0; x < gridW; x++) {
          if (grid[y][x]) {
            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize)
          }
        }
      }

      statusLabel.textContent = gridW + ' × ' + gridH + ' cells (' + canvasW + ' × ' + canvasH + 'px)'
      btnApply.removeAttribute('disabled')
    }

    /* ── Build SVG string ── */
    function buildSvgString() {
      const params = getParams()
      const { grid, gridW, gridH } = computeDither(params)
      const { pixelSize, palette, lightColor, darkColor } = params
      const svgW = gridW * pixelSize
      const svgH = gridH * pixelSize
      const singleRects = document.getElementById('single-rects').value === 'true'

      let bgColor, fgColor
      if (palette === 'wob') {
        bgColor = '#000000'; fgColor = '#FFFFFF'
      } else if (palette === 'bow') {
        bgColor = '#FFFFFF'; fgColor = '#000000'
      } else {
        bgColor = darkColor; fgColor = lightColor
      }

      let fgContent = ''
      if (singleRects) {
        for (let y = 0; y < gridH; y++) {
          for (let x = 0; x < gridW; x++) {
            if (grid[y][x]) {
              const px = x * pixelSize
              const py = y * pixelSize
              fgContent += '<rect x="' + px + '" y="' + py + '" width="' + pixelSize + '" height="' + pixelSize + '" fill="' + fgColor + '"/>'
            }
          }
        }
      } else {
        let pathData = ''
        for (let y = 0; y < gridH; y++) {
          for (let x = 0; x < gridW; x++) {
            if (grid[y][x]) {
              const px = x * pixelSize
              const py = y * pixelSize
              pathData += 'M' + px + ',' + py + 'h' + pixelSize + 'v' + pixelSize + 'H' + px + 'Z'
            }
          }
        }
        if (pathData) {
          fgContent = '<path d="' + pathData + '" fill="' + fgColor + '"/>'
        }
      }

      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + svgW + '" height="' + svgH + '" viewBox="0 0 ' + svgW + ' ' + svgH + '" shape-rendering="crispEdges">' +
        '<rect width="' + svgW + '" height="' + svgH + '" fill="' + bgColor + '"/>' +
        fgContent +
        '</svg>'
    }

    /* ── Load image from bytes ── */
    function loadImageFromBytes(bytes) {
      const blob = new Blob([new Uint8Array(bytes)], { type: 'image/png' })
      const url = URL.createObjectURL(blob)
      const img = new Image()
      img.onload = () => {
        sourceImage = img
        imageLoaded = true
        renderPreview()
      }
      img.src = url
    }

    /* ── Load image from file ── */
    function loadImageFromFile(file) {
      const url = URL.createObjectURL(file)
      const img = new Image()
      img.onload = () => {
        sourceImage = img
        imageLoaded = true
        renderPreview()
      }
      img.src = url
    }

    /* ── Resize pixel art logic ── */
    function updateResizeHeight() {
      if (!pixelArtInfo) return
      const targetWidth = Number(resizeWidthEl.value)
      if (!targetWidth || targetWidth < 1) return
      const ratio = pixelArtInfo.height / pixelArtInfo.width
      const targetHeight = Math.max(1, Math.round(targetWidth * ratio))
      resizeHeightDisplay.textContent = targetHeight + 'px'

      // Check 16px minimum
      if (targetWidth < 16 || targetHeight < 16) {
        resizeWarning.classList.add('visible')
        btnResize.setAttribute('disabled', '')
      } else {
        resizeWarning.classList.remove('visible')
        btnResize.removeAttribute('disabled')
      }
    }

    function showResizeSection(info) {
      pixelArtInfo = info
      resizeSection.classList.add('visible')
      btnResize.style.display = ''
      resizeSourceInfo.textContent = 'Source: ' + info.width + ' × ' + info.height + 'px (' + info.pixelCount + ' pixels)'

      // Set a sensible default width (half of source, clamped to 16 min)
      const defaultWidth = Math.max(16, Math.round(info.width / 2))
      resizeWidthEl.value = String(defaultWidth)
      updateResizeHeight()
    }

    function hideResizeSection() {
      pixelArtInfo = null
      resizeSection.classList.remove('visible')
      btnResize.style.display = 'none'
    }

    resizeWidthEl.addEventListener('change', updateResizeHeight)
    resizeWidthEl.addEventListener('input', updateResizeHeight)

    btnResize.addEventListener('click', () => {
      if (!pixelArtInfo) return
      const targetWidth = Number(resizeWidthEl.value)
      const threshold = Number(resizeThresholdEl.value)
      parent.postMessage({
        pluginMessage: {
          type: 'resize-pixel-art',
          targetWidth: targetWidth,
          threshold: threshold,
        },
      }, '*')
    })

    /* ── Event listeners ── */
    btnUpload.addEventListener('click', () => fileInput.click())
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0]
      if (file) {
        sourceName = file.name.replace(/\.[^.]+$/, '')
        loadImageFromFile(file)
      }
    })

    btnSelect.addEventListener('click', () => {
      parent.postMessage({ pluginMessage: { type: 'select-layer' } }, '*')
    })

    btnApply.addEventListener('click', () => {
      if (!imageLoaded) return
      const svgString = buildSvgString()
      parent.postMessage({ pluginMessage: { type: 'apply-dither', svgString: svgString, sourceName: sourceName } }, '*')
    })

    // Live preview on any control change
    const controlIds = ['output-width', 'pixel-size', 'dither-type', 'threshold', 'brightness', 'contrast', 'light-color', 'dark-color']
    controlIds.forEach((id) => {
      const el = document.getElementById(id)
      if (el) {
        el.addEventListener('input', renderPreview)
        el.addEventListener('change', renderPreview)
      }
    })

    /* ── Messages from plugin ── */
    window.onmessage = (event) => {
      const msg = event.data?.pluginMessage
      if (!msg) return
      if (msg.type === 'select-layer-result' && msg.bytes) {
        if (msg.name) sourceName = msg.name
        loadImageFromBytes(msg.bytes)
      }
      if (msg.type === 'selection-update' && msg.bytes) {
        if (msg.name) sourceName = msg.name
        loadImageFromBytes(msg.bytes)
      }
      if (msg.type === 'pixel-art-info') {
        if (msg.info) {
          showResizeSection(msg.info)
        } else {
          hideResizeSection()
        }
      }
      if (msg.type === 'resize-done') {
        // Selection will change to new frame, which triggers a new detection
      }
    }
  </script>
</body>
</html>
